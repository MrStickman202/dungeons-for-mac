# Temporary: end-to-end run of the owned-games search with a fake sign-in client
# and a synthetic owned list (public product IDs only).
name: repro
on:
  push:
    paths: [.github/workflows/repro.yml, .github/repro/**]
permissions:
  contents: write
jobs:
  repro:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: run
        run: |
          set -x
          export DFM_HOME="$RUNNER_TEMP/h/DungeonsForMac"
          mkdir -p "$DFM_HOME/client" "$DFM_HOME/state" "$DFM_HOME/logs" out
          printf '#!/bin/bash\ncat %q\n' "$PWD/.github/repro/owned.json" > "$DFM_HOME/client/xodus-cli"
          chmod 755 "$DFM_HOME/client/xodus-cli"
          echo "signed_in=1" > "$DFM_HOME/settings.conf"
          /bin/bash app/core.sh library "" refresh > out/1-bash.txt 2>&1; echo "rc=$?" >> out/1-bash.txt
          cp "$DFM_HOME/logs/library.log" out/1-library.log 2>/dev/null
          cp "$DFM_HOME/state/library.txt" out/1-cache.txt 2>/dev/null
          ls -la "$DFM_HOME/state" > out/1-state.txt
          /usr/bin/osascript -l JavaScript "$DFM_HOME/state/library.js" owned "$DFM_HOME/state/library.json" > out/2-owned.txt 2>&1
          osascript -e "do shell script \"DFM_HOME=\" & quoted form of \"$DFM_HOME\" & \" /bin/bash \" & quoted form of \"$PWD/app/core.sh\" & \" library '' refresh\"" > out/3-applescript.txt 2>&1
          cp "$DFM_HOME/logs/library.log" out/3-library.log 2>/dev/null
      - name: push
        if: always()
        run: |
          cd out && git init -q -b repro && git config user.name a && git config user.email a@b.c
          git add . && git commit -qm repro && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" repro
