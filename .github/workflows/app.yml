# Checks the app on a real Mac (shell syntax, AppleScript compile) and publishes it:
#   app-latest/app.tar.gz          what the installed app's launcher updates itself from
#   app-latest/Dungeons-for-Mac.zip a fresh copy of the app for new installs
#   app-latest/dfm-curl.tar.gz      Windows libcurl that replaces XCurl.dll (Bedrock's network fix)
name: app
on:
  push:
    paths:
      - app/**
      - .github/workflows/app.yml
  workflow_dispatch:
permissions:
  contents: write
env:
  # Pinned Windows curl build (Ferestre's pin): https://curl.se/windows/
  CURL_WIN_VERSION: 8.22.0_1
  CURL_WIN_SHA256: 7f23b039f6ea4197362d4468e1a0e71428201222e1bef3b680d5ef7b2aefb714
jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: check scripts
        run: |
          set -euo pipefail
          /bin/bash -n app/core.sh
          /bin/bash -n app/launcher.sh
          grep -qE '^DFM_BUILD=[0-9]+' app/core.sh
          echo "build $(sed -n 's/^DFM_BUILD=\([0-9]*\).*/\1/p' app/core.sh)"
      - name: compile the window (AppleScript)
        run: |
          set -euo pipefail
          /usr/bin/osacompile -o "$RUNNER_TEMP/check.app" app/ui.applescript
          echo "ui.applescript compiles"
      - name: smoke-test the engine script
        run: |
          set -euo pipefail
          export DFM_HOME="$RUNNER_TEMP/dfm home/Application Support/DungeonsForMac"  # spaces, like the real path
          /bin/bash app/core.sh status
          /bin/bash app/core.sh games
          /bin/bash app/core.sh add-game "Test" 9PP5G1F0C2B6
          /bin/bash app/core.sh games | grep -q '^9pp5g1f0c2b6|Test|notdownloaded$'
          /bin/bash app/core.sh remove-game 9pp5g1f0c2b6
          /bin/bash app/core.sh set display exclusive | grep -q '^ok'
          /bin/bash app/core.sh status | grep -qx 'display=exclusive'
          /bin/bash app/core.sh set upscale 1.5 | grep -q '^ok'
          /bin/bash app/core.sh status | grep -qx 'upscale=1.5'
          /bin/bash app/core.sh reset-settings >/dev/null 2>&1 || true
          # Bedrock add-on import: an .mcaddon with a behavior + resource pack, and an .mcworld
          A="$RUNNER_TEMP/addon test"; mkdir -p "$A/bp" "$A/rp" "$A/w/db" "$DFM_HOME/prefix/drive_c/users/runner"
          printf '{"format_version":2,"header":{"name":"Test BP","uuid":"a"},"modules":[{"type":"data"}]}' > "$A/bp/manifest.json"
          printf '// comment\n{"format_version":2,"header":{"name":"\u00a7aTest RP","uuid":"b"},"modules":[{"type":"resources"}]}' > "$A/rp/manifest.json"
          echo x > "$A/w/level.dat"
          (cd "$A/bp" && zip -qr ../bp.mcpack .) && (cd "$A/rp" && zip -qr ../rp.mcpack .) && (cd "$A" && zip -q test.mcaddon bp.mcpack rp.mcpack) && (cd "$A/w" && zip -qr "../my world.mcworld" .)
          /bin/bash app/core.sh import-addons "$A/test.mcaddon" "$A/my world.mcworld" | tee imp.txt
          grep -q '^ok|Imported 2 pack(s) and 1 world(s)' imp.txt
          M="$DFM_HOME/prefix/drive_c/users/runner/AppData/Roaming/Minecraft Bedrock/Users/Shared/games/com.mojang"
          test -f "$M/behavior_packs/Test BP/manifest.json" && test -f "$M/resource_packs/Test RP/manifest.json"
          ls "$M/minecraftWorlds"/*/level.dat
          # Steam: library from a stand-in Steam folder, names from the Steam store
          R="$DFM_HOME/steam-prefix/drive_c/Program Files (x86)/Steam"
          mkdir -p "$R/steamapps" "$R/appcache/librarycache/815370" "$R/appcache/librarycache/220" "$R/appcache/librarycache/400"
          printf '"AppState"\n{\n\t"appid"\t\t"815370"\n\t"name"\t\t"Green Hell"\n\t"StateFlags"\t\t"4"\n\t"installdir"\t\t"Green Hell"\n}\n' > "$R/steamapps/appmanifest_815370.acf"
          printf '"AppState"\n{\n\t"appid"\t\t"400"\n\t"name"\t\t"Portal"\n\t"StateFlags"\t\t"1026"\n\t"BytesToDownload"\t\t"1000"\n\t"BytesDownloaded"\t\t"250"\n}\n' > "$R/steamapps/appmanifest_400.acf"
          /bin/bash app/core.sh steam-games | tee sg.txt
          grep -qx '815370|Green Hell|ready|' sg.txt
          grep -qx '400|Portal|downloading|25' sg.txt
          grep -q '^220|Half-Life 2|notinstalled|' sg.txt || { echo "note: store name lookup for 220:"; cat "$DFM_HOME/state/steam-names.txt"; exit 1; }
          /bin/bash app/core.sh steam-status
          /bin/bash app/core.sh steam-renderer 815370 d3dmetal | grep -q '^ok'
          test "$(/bin/bash app/core.sh steam-renderer-get 815370)" = d3dmetal
          /bin/bash app/core.sh power-check
          # the wine shim under macOS's bash 3.2, with a stand-in wine
          printf '#!/bin/bash\nfor a in "$@"; do echo "[$a]"; done\n' > "$RUNNER_TEMP/fakewine"; chmod +x "$RUNNER_TEMP/fakewine"
          /bin/bash app/core.sh set display fullscreen >/dev/null
          out=$(DFM_TEST_WINE="$RUNNER_TEMP/fakewine" DFM_GAME=dungeons /bin/bash app/core.sh __wine 'Z:\x\Dungeons.exe' 2>/dev/null); echo "$out"
          echo "$out" | grep -qx '\[-fullscreen\]'
          /bin/bash app/core.sh set display game >/dev/null
          out=$(DFM_TEST_WINE="$RUNNER_TEMP/fakewine" DFM_GAME=dungeons /bin/bash app/core.sh __wine 'Z:\x\Dungeons.exe' 2>/dev/null); echo "$out"
          test "$out" = '[Z:\x\Dungeons.exe]'
          # Store catalog lookup: names, MSIXVC detection, bundle children
          /bin/bash app/core.sh catalog 9NBLGGH2JHXJ 9P8MK4NC0LJB 9NXP44L49SHJ 9WZDNCRFJ3TJ | tee cat.txt
          grep -q '^9NBLGGH2JHXJ|.*|msixvc|' cat.txt
          grep -q '^9P8MK4NC0LJB|.*|msixvc|' cat.txt
          grep -q '^9NXP44L49SHJ|.*|.*|.*9NBLGGH2JHXJ' cat.txt || echo "note: bundle children not listed"
          # owned-list reader
          mkdir -p "$DFM_HOME/state"
          printf '%s' '{"count":3,"items":[{"productId":"9NBLGGH2JHXJ","productType":"Game","status":"Active"},{"productId":"9XXXXXXXXXX1","productType":"Durable","status":"Active"},{"productId":"9XXXXXXXXXX2","productType":"Game","status":"Expired"}]}' > "$DFM_HOME/state/owned.json"
          test "$(/usr/bin/osascript -l JavaScript "$DFM_HOME/state/library.js" owned "$DFM_HOME/state/owned.json")" = 9NBLGGH2JHXJ
      - name: Windows libcurl for the XCurl swap
        run: |
          set -euo pipefail
          curl -sSfL -o curl.zip "https://curl.se/windows/dl-${CURL_WIN_VERSION}/curl-${CURL_WIN_VERSION}-win64-mingw.zip"
          echo "${CURL_WIN_SHA256}  curl.zip" | shasum -a 256 -c -
          mkdir -p x curl && unzip -q curl.zip -d x
          cp "$(find x -name libcurl-x64.dll | head -1)" curl/libcurl-x64.dll
          ca=$(find x -name curl-ca-bundle.crt | head -1); [ -n "$ca" ] && cp "$ca" curl/curl-ca-bundle.crt
          cp "$(find x -iname 'COPYING*' | head -1)" curl/COPYING.txt 2>/dev/null || true
          tar -czf dfm-curl.tar.gz curl
          shasum -a 256 dfm-curl.tar.gz | tee dfm-curl.tar.gz.sha256
      - name: package
        run: |
          set -euo pipefail
          mkdir -p pkg/app
          cp app/core.sh app/ui.applescript app/launcher.sh app/AppIcon.icns pkg/app/
          tar -C pkg -czf app.tar.gz app
          shasum -a 256 app.tar.gz | tee app.tar.gz.sha256
          A="pkg/Dungeons for Mac.app/Contents"
          mkdir -p "$A/MacOS" "$A/Resources"
          cp app/Info.plist "$A/"
          printf 'APPL????' > "$A/PkgInfo"
          cp app/launcher.sh "$A/MacOS/DungeonsForMac"
          cp app/core.sh app/ui.applescript app/AppIcon.icns "$A/Resources/"
          chmod 755 "$A/MacOS/DungeonsForMac" "$A/Resources/core.sh"
          codesign --force --deep --sign - "pkg/Dungeons for Mac.app"
          (cd pkg && ditto -c -k --keepParent "Dungeons for Mac.app" ../Dungeons-for-Mac.zip)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete app-latest -R "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create app-latest -R "${{ github.repository }}" --prerelease \
            --title "App (build $(sed -n 's/^DFM_BUILD=\([0-9]*\).*/\1/p' app/core.sh), ${GITHUB_SHA::7})" \
            --notes "The app updates itself from here. Fresh install: download Dungeons-for-Mac.zip, unzip, move to Applications, right-click > Open the first time." \
            app.tar.gz app.tar.gz.sha256 Dungeons-for-Mac.zip dfm-curl.tar.gz dfm-curl.tar.gz.sha256
